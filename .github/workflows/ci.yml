name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Formatting
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Vet for Linux, Windows and macOS
        shell: bash
        run: |
          go vet ./...
          GOOS=linux go vet ./...
          GOOS=windows go vet ./...
          GOOS=darwin go vet ./...
      # The Opus decoder's conformance test decodes the test vectors of RFC
      # 8251. They never change: download them once, and check them.
      - name: Cache the Opus test vectors
        if: runner.os == 'Linux'
        id: opus-vectors
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/opus-vectors
          key: opus-testvectors-rfc8251
      - name: Download the Opus test vectors
        if: runner.os == 'Linux' && steps.opus-vectors.outputs.cache-hit != 'true'
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/opus-vectors.tar.gz" https://opus-codec.org/static/testvectors/opus_testvectors-rfc8251.tar.gz
          echo "6b26a22f9ba87b2b836906a9bb7afec5f8e54d49553b1200382520ee6fedfa55  $RUNNER_TEMP/opus-vectors.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/opus-vectors"
          tar -xzf "$RUNNER_TEMP/opus-vectors.tar.gz" -C "$RUNNER_TEMP/opus-vectors"
      - name: Test
        run: go test ./...
        env:
          OPUS_TESTVECTORS: ${{ runner.os == 'Linux' && format('{0}/opus-vectors/opus_newvectors', runner.temp) || '' }}
      - name: Community registry
        run: go run ./tools/registry -check

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run build:web

  build:
    name: Build ${{ matrix.platform }}
    needs: [go, frontend]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [windows/amd64, linux/amd64, darwin/universal]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Install NSIS, for the Windows installer
        if: startsWith(matrix.platform, 'windows/')
        run: sudo apt-get update && sudo apt-get install -y nsis
      - run: bun run build -- -platform "${{ matrix.platform }}"
      # The release makes these from the builds too: try it on every change.
      - name: Package the portable zip, the RPM and the AppImage
        if: ${{ !startsWith(matrix.platform, 'darwin/') }}
        run: |
          bash .github/scripts/package.sh "$(jq -r .version package.json)" packages
          ls -l packages
